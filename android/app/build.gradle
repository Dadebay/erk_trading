plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '17'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '2.2.5'
}

def releaseKeyPropertiesFile = rootProject.file('key.properties')
def releaseKeyProperties = new Properties()
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyPropertiesFile.withInputStream { releaseKeyProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { field ->
        if (!releaseKeyProperties.getProperty(field)?.trim()) {
            throw new GradleException("android/key.properties is missing ${field}")
        }
    }
}

android {
    namespace "com.gurbanov.erktrading"
    compileSdk 36
    ndkVersion "29.0.14206865"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.gurbanov.erktrading"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (releaseKeyPropertiesFile.exists()) {
            release {
                storeFile file(releaseKeyProperties.getProperty('storeFile'))
                storePassword releaseKeyProperties.getProperty('storePassword')
                keyAlias releaseKeyProperties.getProperty('keyAlias')
                keyPassword releaseKeyProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeyPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {}
